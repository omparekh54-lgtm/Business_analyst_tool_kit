[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-analyst-tool-kit"
version = "0.2.0"
description = "Local-first, explainable analysis of business spreadsheets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pandas>=2.1,<3", "openpyxl>=3.1,<4", "numpy>=1.26,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
app = ["streamlit>=1.35,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
analystkit = "analystkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
